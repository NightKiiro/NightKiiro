<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="NightKiiro - two pixel slimes escaping a lab">
<!-- 🧪 lab log #2 : 337363347033645f7468335f6c34627d -->
<style>
  .bob { animation: bob 0.9s steps(2) infinite; }
  .bob2 { animation: bob 0.9s steps(2) infinite; animation-delay: .45s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .left  { animation: goLeft 6s ease-in-out infinite; }
  .right { animation: goRight 6s ease-in-out infinite; }
  @keyframes goLeft  { 0%,15% { transform: translateX(0); } 45%,60% { transform: translateX(150px); } 90%,100% { transform: translateX(0); } }
  @keyframes goRight { 0%,15% { transform: translateX(0); } 45%,60% { transform: translateX(-150px); } 90%,100% { transform: translateX(0); } }

  .merge { opacity: 0; animation: merge 6s infinite; }
  @keyframes merge { 0%,44% { opacity: 0; } 47%,58% { opacity: 1; } 61%,100% { opacity: 0; } }

  .bubble { animation: rise 3.5s linear infinite; opacity: 0; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-120px); opacity: 0; } }

  .dust { animation: twinkle 4s steps(2) infinite; }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .8; } }

  .alarm { animation: alarm 1.2s steps(1) infinite; }
  @keyframes alarm { 0%,50% { fill: #FF4D6D; } 51%,100% { fill: #4A1424; } }

  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

  .type { clip-path: inset(0 100% 0 0); animation: type 3s steps(34) 0.4s forwards; }
  @keyframes type { to { clip-path: inset(0 0 0 0); } }

  .scan { animation: scan 5s linear infinite; }
  @keyframes scan { 0% { transform: translateY(-20px); } 100% { transform: translateY(300px); } }

  .title { font: 700 54px "Courier New", ui-monospace, monospace; letter-spacing: 6px; }
  .sub { font: 600 17px "Courier New", ui-monospace, monospace; }
  .tag { font: 700 12px "Courier New", ui-monospace, monospace; letter-spacing: 2px; }
</style>

