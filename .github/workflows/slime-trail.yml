name: Slime trail

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the contribution "snake" in slime colours
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/slime-trail.svg?color_snake=#5FB3A0&color_dots=#ebedf0,#c8f7d5,#9ff0b5,#7CFC9A,#2E8B57
            dist/slime-trail-dark.svg?palette=github-dark&color_snake=#5FB3A0&color_dots=#161b22,#1E5B3A,#2E8B57,#4CC777,#7CFC9A

      - name: Push the result to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
