name: Slimy

on:
  issues:
    types: [opened]

# one move at a time, in the order they arrive
concurrency:
  group: slimy
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'slimy|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Play the move
        # issue data goes through env vars, never straight into the shell (no injection)
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
        run: python3 game/slimy.py "$TITLE" "$PLAYER"

      - name: Commit the new board
        env:
          PLAYER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "slimy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/state.json game/board.svg README.md
          git diff --cached --quiet || git commit -m "🟢 Slimy: move by @$PLAYER"
          git push

      - name: Answer and close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file game/.reply.md
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
