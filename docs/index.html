<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Slimy — by NightKiiro</title>
<meta name="description" content="Two slimes, one controller. Fuse, split and escape the lab: a web version of Slimy, a puzzle-platformer made at Epitech." />
<meta property="og:title" content="Slimy — two slimes, one controller" />
<meta property="og:description" content="Fuse, split and escape the lab. Play in your browser." />
<meta property="og:image" content="assets/menu/clear_bg.png" />
<link rel="icon" href="assets/menu/icon.png" />
<style>
  :root { --bg: #040c14; --teal: #50e8d6; --ink: #eaf6ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink);
    font-family: ui-monospace, "Courier New", monospace; -webkit-user-select: none; user-select: none; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #end-links[hidden] { display: none; }
  #end-links { position: fixed; left: 50%; bottom: 9%; transform: translateX(-50%); display: flex; gap: 14px; }
  #end-links a, #end-links button { font: 700 14px ui-monospace, monospace; letter-spacing: 1px; color: #040c14;
    background: var(--teal); border: 0; padding: 12px 16px; text-decoration: none; cursor: pointer;
    box-shadow: 0 4px 0 #1f8f84; text-transform: uppercase; }
  #end-links a.alt { background: #eaf6ff; box-shadow: 0 4px 0 #8ea3b8; }

  /* touch controls */
  #pad { display: none; position: fixed; inset: auto 0 0 0; padding: 12px 16px; justify-content: space-between; pointer-events: none; }
  .touch #pad { display: flex; }
  #pad .grp { display: flex; gap: 10px; pointer-events: auto; }
  #pad button { width: 62px; height: 62px; border-radius: 14px; border: 3px solid rgba(80, 232, 214, .55);
    background: rgba(4, 12, 20, .55); color: var(--ink); font: 700 18px ui-monospace, monospace; touch-action: none; }
  #pad button.on { background: rgba(80, 232, 214, .35); }
  #rotate { display: none; position: fixed; inset: 0; background: var(--bg); place-items: center; text-align: center;
    padding: 30px; z-index: 5; color: var(--teal); font-size: 15px; line-height: 2; }
  @media (orientation: portrait) { .touch #rotate { display: grid; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720" aria-label="Slimy"></canvas></div>

<div id="end-links" hidden>
  <button onclick="location.reload()">Play again</button>
  <a class="alt" href="https://github.com/NightKiiro">NightKiiro on GitHub</a>
</div>

<div id="pad">
  <div class="grp">
    <button data-a="left" aria-label="Left">◀</button>
    <button data-a="right" aria-label="Right">▶</button>
  </div>
  <div class="grp">
    <button data-a="restart" aria-label="Restart">↺</button>
    <button data-a="fuse" aria-label="Fuse or split">F</button>
    <button data-a="jump" aria-label="Jump">▲</button>
  </div>
</div>
<div id="rotate">↻<br />Turn your phone sideways to play</div>

<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script>
  // touch buttons send the same actions as the keyboard
  document.querySelectorAll("#pad button").forEach((b) => {
    const a = b.dataset.a;
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.classList.add("on"); window.SlimyInput.press(a); });
    ["pointerup", "pointercancel", "pointerleave"].forEach((ev) =>
      b.addEventListener(ev, (e) => { e.preventDefault(); b.classList.remove("on"); window.SlimyInput.release(a); }));
  });
</script>
</body>
</html>
